services:
  opentenbase-dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: opentenbase-dev-container
    user: "root"
    # 我们暂时注释掉 command，方便我们手动进入容器进行首次编译
    # 这样启动的容器会一直运行，等待我们连接
    command: tail -f /dev/null
    # cap_add 和 security_opt 是 GDB 调试所必需的
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      # 将当前目录挂载到容器中
      - .:/data/project/OpenTenBase:cached
      # 创建一个持久化的数据卷，存放数据库节点数据
      - opentenbase-nodes:/data/nodes
    ports:
      # 将容器的 30004 端口映射到主机的 30004 端口
      - "30004:30004"

volumes:
  opentenbase-nodes:
